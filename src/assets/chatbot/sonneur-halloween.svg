<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sonneur, version Halloween">
  <!-- Sonneur version Halloween (15 octobre - 2 novembre) : nuit violette, lune, chauve-souris, chapeau de sorcière.
       Sonneur, mascotte du chatbot : sonneur à ventre jaune (Bombina variegata), pupilles en cœur -->
  <defs>
    <clipPath id="sonneur-cadre">
      <circle cx="32" cy="32" r="32"/>
    </clipPath>
    <!-- Pupille en cœur, centrée sur l'origine -->
    <path id="sonneur-pupille" d="M0 3.2 C-4.6 0.2 -4.2 -3.6 -1.9 -3.6 C-0.9 -3.6 -0.2 -2.9 0 -2.2 C0.2 -2.9 0.9 -3.6 1.9 -3.6 C4.2 -3.6 4.6 0.2 0 3.2 Z"/>
  </defs>

  <g clip-path="url(#sonneur-cadre)">
    <circle cx="32" cy="32" r="32" fill="#2e1a47"/>
    <!-- Pleine lune, chauve-souris en ombre chinoise et étoiles -->
    <circle cx="13" cy="13" r="7.5" fill="#fff3c4"/>
    <path d="M7.5 13.5 q1.5 -2.2 3 -0.6 q0.8 -1.6 1.6 -0.2 l0.9 -1.4 l0.9 1.4 q0.8 -1.4 1.6 0.2 q1.5 -1.6 3 0.6 q-1.8 -0.3 -2.4 1.2 q-0.9 -1 -1.8 0.1 l-1.3 1.3 l-1.3 -1.3 q-0.9 -1.1 -1.8 -0.1 q-0.6 -1.5 -2.4 -1.2 Z" fill="#1b1028"/>
    <circle cx="55" cy="14" r="0.9" fill="#fff3c4"/>
    <circle cx="49" cy="6" r="0.7" fill="#fff3c4"/>
    <circle cx="5" cy="27" r="0.7" fill="#fff3c4"/>

    <!-- Ventre jaune marbré de noir -->
    <ellipse cx="32" cy="58" rx="24" ry="16" fill="#fec700"/>
    <path d="M14 52 q4 -3 7 0 q-1 4 -5 4 q-3 -1 -2 -4 Z" fill="#26323a"/>
    <path d="M27 50 q5 -2 9 1 q-2 3 -5 2 q-3 1 -4 -3 Z" fill="#26323a"/>
    <path d="M42 53 q5 -3 8 1 q-2 4 -6 3 q-3 -1 -2 -4 Z" fill="#26323a"/>
    <circle cx="23" cy="59" r="2.2" fill="#26323a"/>
    <circle cx="38" cy="60" r="2.6" fill="#26323a"/>
    <circle cx="48" cy="61" r="1.6" fill="#26323a"/>

    <!-- Pattes avant, doigts jaunes -->
    <ellipse cx="13" cy="51" rx="6" ry="3.2" fill="#fec700" transform="rotate(-25 13 51)"/>
    <ellipse cx="51" cy="51" rx="6" ry="3.2" fill="#fec700" transform="rotate(25 51 51)"/>
  </g>

  <!-- Tête : dos gris-olive verruqueux -->
  <ellipse cx="32" cy="35" rx="24" ry="14" fill="#6b6a4c"/>
  <circle cx="20" cy="40" r="1.4" fill="#57563c"/>
  <circle cx="44" cy="40" r="1.4" fill="#57563c"/>
  <circle cx="26" cy="27" r="1.2" fill="#7f7d5a"/>
  <circle cx="38" cy="27" r="1.2" fill="#7f7d5a"/>
  <circle cx="32" cy="25" r="1" fill="#7f7d5a"/>

  <!-- Yeux saillants -->
  <circle cx="20" cy="24" r="9" fill="#6b6a4c"/>
  <circle cx="44" cy="24" r="9" fill="#6b6a4c"/>
  <circle cx="20" cy="24" r="6.6" fill="#e8b23a"/>
  <circle cx="44" cy="24" r="6.6" fill="#e8b23a"/>
  <use href="#sonneur-pupille" transform="translate(20 24.5)" fill="#1b1b1b"/>
  <use href="#sonneur-pupille" transform="translate(44 24.5)" fill="#1b1b1b"/>
  <circle cx="22.4" cy="21.4" r="1.3" fill="#ffffff"/>
  <circle cx="46.4" cy="21.4" r="1.3" fill="#ffffff"/>

  <!-- Narines, joues et sourire -->
  <circle cx="29.5" cy="33" r="0.9" fill="#3b3a28"/>
  <circle cx="34.5" cy="33" r="0.9" fill="#3b3a28"/>
  <circle cx="15.5" cy="38" r="2.4" fill="#f8baba" opacity="0.8"/>
  <circle cx="48.5" cy="38" r="2.4" fill="#f8baba" opacity="0.8"/>
  <path d="M19 39 Q32 47 45 39" fill="none" stroke="#3b3a28" stroke-width="2" stroke-linecap="round"/>

  <!-- Chapeau de sorcière, posé entre les yeux -->
  <g transform="translate(32 17) scale(1.25) rotate(-8) translate(-32 -17)">
    <ellipse cx="32" cy="16.5" rx="11" ry="2.6" fill="#1b1028"/>
    <path d="M25.5 16 L31 1.5 Q33 0.5 33.5 3 L38.5 16 Z" fill="#1b1028"/>
    <path d="M26.6 13.2 L37.4 13.2 L38.4 15.8 L25.6 15.8 Z" fill="#d77813"/>
    <rect x="30.6" y="13.4" width="2.8" height="2.2" rx="0.4" fill="none" stroke="#fec700" stroke-width="0.8"/>
  </g>

  <!-- Liseré discret : la pastille reste détourée sur une page blanche -->
  <circle cx="32" cy="32" r="31.25" fill="none" stroke="#5b3f80" stroke-width="1.5"/>
</svg>
