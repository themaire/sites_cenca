<div class="carousel-container" *ngIf="images.length">
  <button class="nav left" (click)="prev()"><</button>

  <div class="carousel-image" #frame
       [class.zoomed]="isZoomed"
       [class.dragging]="isDragging"
       (mousemove)="onMouseMove($event)"
       (mouseup)="onMouseUp()"
       (mouseleave)="onMouseLeave()">
    <!-- Grosses photos : on fait patienter tant que l'image n'est pas chargée -->
    <div class="chargement" *ngIf="isLoading">
      <mat-spinner diameter="56"></mat-spinner>
      <span>Chargement de la photo…</span>
    </div>
    <div class="chargement" *ngIf="hasError">
      <mat-icon fontIcon="broken_image"></mat-icon>
      <span>Impossible de charger la photo</span>
    </div>

    <img [src]="images[currentIndex]" alt="Image {{ currentIndex + 1 }}"
         [class.masquee]="isLoading || hasError"
         [style.width.px]="isZoomed ? zoomedWidth : null"
         (load)="onImageLoad()"
         (error)="onImageError()"
         [title]="isZoomed ? 'Cliquer pour revenir à la vue entière' : 'Cliquer pour zoomer'"
         (mousedown)="onMouseDown($event)"
         (click)="toggleZoom($event)" />
  </div>

  <button class="nav right" (click)="next()">></button>
  <div class="bottom">
    <mat-icon
      aria-hidden="false"
      aria-label="save icon"
      fontIcon="save_alt"
      class="icon"
      (click)="saveImage(images[currentIndex])"
    ></mat-icon>
    <div class="carousel-indicators">
      <span
        *ngFor="let img of images; let i = index"
        [class.active]="i === currentIndex"
        (click)="goTo(i)"
      >
      </span>
    </div>
  </div>
</div>
