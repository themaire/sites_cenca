<div class="site-detail web">
  <div class="fond">
    <!-- Bouton Retour bleu en haut-->
    <div class="container-btn-h">
      <!-- Permalien de la fiche, à partager -->
      <div class="lien" *ngIf="siteDetail">
        <button mat-button type="button" (click)="copierLien()"
          matTooltip="Copier l'adresse de cette fiche pour la partager">
          <mat-icon>link</mat-icon> Copier le lien
        </button>
      </div>

      <button
        mat-button-flat
        class="btn"
        type="button"
        (click)="resetSelectedd()"
      >
        Retour
      </button>

      <!-- Suppression d'un site créé par erreur (refusée par le backend si des données y sont rattachées) -->
      <div class="suppression" *ngIf="isEditAllowed && siteDetail">
        <button mat-button type="button" [disabled]="deleting" (click)="deleteSiteConfirm()">
          Supprimer le site
        </button>
      </div>
    </div>
    <!-- Lien vers un site inexistant (périmé ou supprimé) -->
    <div class="introuvable" *ngIf="introuvable">
      <mat-icon>search_off</mat-icon>
      <p>Ce site est introuvable : le lien est peut-être périmé, ou le site a été supprimé.</p>
    </div>

    <!-- Titre -->
    <h2 *ngIf="siteDetail !== undefined && !introuvable">
      {{ siteDetail.description_site }}
    </h2>

    <ng-container *ngIf="!introuvable">
      <div *ngIf="isMobile; then mobile; else desktop" class="site-detail"></div>
    </ng-container>

    <ng-template #desktop>
      <!-- Onglets supérieurs -->
      <mat-tab-group class="mat-mdc-tab-group top-tabs">
        <mat-tab label="Infos générales">
          <app-detail-infos [inputDetail]="siteDetail"> </app-detail-infos>
        </mat-tab>

        <mat-tab label="Description et Ouverture">
          <app-detail-description [inputDetail]="siteDetail">
          </app-detail-description>
        </mat-tab>

        <mat-tab label="Actes MFU">
          <app-detail-mfu [inputDetail]="siteDetail"> </app-detail-mfu>
        </mat-tab>

        <mat-tab label="Actions">
          <app-detail-actions [siteDetailProjet]="siteDetailProjet"> </app-detail-actions>
        </mat-tab>

        <mat-tab label="Plans de gestion">
          <app-detail-gestion [inputDetail]="siteDetail"> </app-detail-gestion>
        </mat-tab>

        <mat-tab label="Habitats">
          <app-detail-habitats [inputDetail]="siteDetail">
          </app-detail-habitats>
        </mat-tab>
      </mat-tab-group>
    </ng-template>

    <!--  <div class="container-btn-b">
      <button class="btn" type="button" (click)="resetSelectedd()">
        Retour
      </button>
    </div>-->
  </div>
</div>

<div class="mobile site-detail">
  <ng-template #mobile>
    <!--   Onglets supérieurs -->
    <mat-tab-group class="bloc1">
      <mat-tab label="Infos gén.">
        <app-detail-infos [inputDetail]="siteDetail"> </app-detail-infos>
      </mat-tab>

      <mat-tab label="Desc. et Ouv.">
        <app-detail-description [inputDetail]="siteDetail">
        </app-detail-description>
      </mat-tab>
    </mat-tab-group>

    <mat-tab-group class="bloc2">
      <mat-tab label="Actes MFU">
        <app-detail-mfu [inputDetail]="siteDetail"> </app-detail-mfu>
      </mat-tab>

      <mat-tab label="Actions">
        <app-detail-actions [siteDetailProjet]="siteDetailProjet"> </app-detail-actions>
      </mat-tab>
    </mat-tab-group>

    <mat-tab-group class="bloc3">
      <mat-tab label="Gestion">
        <app-detail-gestion [inputDetail]="siteDetail"> </app-detail-gestion>
      </mat-tab>

      <mat-tab label="Habitats">
        <app-detail-habitats [inputDetail]="siteDetail"> </app-detail-habitats>
      </mat-tab>
    </mat-tab-group>
  </ng-template>
</div>
